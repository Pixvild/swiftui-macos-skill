name: Collect SwiftUI documents and merge when complete
on:
  push:
    branches: [codex/swiftui-macos-skill]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/collect-full.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: swiftui-full-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      final_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tools before collection
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_skill.py
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: |
            .cache/full
            references/local/full
          key: swiftui-full-v1-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: swiftui-full-v1-
      - name: Collect reachable official documents and resolve transient failures
        run: |
          for attempt in 1 2 3; do
            if python scripts/collect_docs.py --workers 8 --interval 0.25 --retry-failed; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          exit 1
      - name: Verify raw hashes and build readable bodies and index
        run: |
          python scripts/export_collection.py --require-complete
          python -m unittest discover -s tests -v
          python scripts/validate_skill.py
      - name: Save resumable checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/full
            references/local/full
          key: swiftui-full-v1-${{ github.sha }}-${{ github.run_attempt }}
      - name: Preserve complete corpus and audit data
        id: archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-official-complete-${{ github.run_id }}
          path: references/local/full
          retention-days: 90
          if-no-files-found: error
      - name: Publish completion evidence on the development branch
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          CORPUS_URL: ${{ steps.archive.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          current=$(gh api repos/Pixvild/swiftui-macos-skill/git/ref/heads/codex/swiftui-macos-skill --jq '.object.sha')
          test "$current" = "$EXPECTED_SHA"
          python scripts/publish_collection_report.py
          python -m unittest discover -s tests -v
          python scripts/validate_skill.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c codex/swiftui-macos-skill
          git add references/full-catalog.json references/full-sources.json references/full-coverage.md reports/full-coverage.json
          git commit -m 'docs: publish verified complete SwiftUI collection index and corpus location'
          git push origin HEAD:refs/heads/codex/swiftui-macos-skill
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate-final:
    needs: collect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.final_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate the exact generated commit before merging
        run: |
          test "$(git rev-parse HEAD)" = '${{ needs.collect.outputs.final_sha }}'
          python -m unittest discover -s tests -v
          python scripts/validate_skill.py
  merge:
    needs: [collect, validate-final]
    runs-on: ubuntu-latest
    steps:
      - name: Merge only the verified complete collection
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.collect.outputs.final_sha }}
        run: |
          test -n "$HEAD_SHA"
          test "$(gh api repos/Pixvild/swiftui-macos-skill/git/ref/heads/codex/swiftui-macos-skill --jq '.object.sha')" = "$HEAD_SHA"
          if [ "$(gh pr view 1 --repo Pixvild/swiftui-macos-skill --json isDraft --jq '.isDraft')" = 'true' ]; then
            gh pr ready 1 --repo Pixvild/swiftui-macos-skill
          fi
          merged=$(gh api --method PUT repos/Pixvild/swiftui-macos-skill/pulls/1/merge -f sha="$HEAD_SHA" -f merge_method=merge -f commit_title='Merge verified SwiftUI document collection and skill tooling' --jq '.merged')
          test "$merged" = 'true'
